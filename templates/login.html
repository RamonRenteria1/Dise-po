{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow-lg p-4 border-0 border-top border-info border-4">
            <div class="card-body text-center">
                <div class="mb-4">
                    <span class="fs-1">👤</span>
                    <h3 class="fw-bold text-dark mt-2">Bienvenido</h3>
                    <p class="text-muted small">Inicia sesión para gestionar tus tareas</p>
                </div>
                <form method="POST">
                    <div class="mb-3 text-start">
                        <label class="form-label small fw-bold text-muted">Email</label>
                        <input type="email" name="email" class="form-control border-secondary-subtle" placeholder="ejemplo@correo.com" required>
                    </div>
                    <div class="mb-3 text-start">
                        <label class="form-label small fw-bold text-muted">Contraseña</label>
                        <input type="password" name="password" class="form-control border-secondary-subtle" placeholder="••••••••" required>
                    </div>
                    
                    <div class="mb-4 text-end">
                        <a href="{{ url_for('recuperar') }}" class="small text-decoration-none text-info fw-bold">¿Olvidaste tu contraseña?</a>
                    </div>

                    <button type="submit" class="btn btn-dark w-100 rounded-pill fw-bold py-2 border-info">Entrar</button>
                </form>
                <p class="mt-4 small">¿Eres nuevo? <a href="{{ url_for('registro') }}" class="fw-bold text-info text-decoration-none">Regístrate</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
