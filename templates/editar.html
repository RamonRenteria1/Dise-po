{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow border-0 rounded-4">
            <div class="card-header bg-dark text-white py-3 border-bottom border-primary border-3">
                <h5 class="mb-0 fw-bold text-center">Editar Actividad</h5>
            </div>
            <div class="card-body p-4 bg-white">
                <form method="POST" action="{{ url_for('editar_tarea', tarea_id=tarea._id) }}">
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">Título</label>
                        <input type="text" name="titulo" class="form-control bg-light border-0 shadow-sm" value="{{ tarea.titulo }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">Instrucciones</label>
                        <textarea name="descripcion" class="form-control bg-light border-0 shadow-sm" rows="3">{{ tarea.descripcion }}</textarea>
                    </div>
                    <div class="d-flex gap-2 justify-content-center">
                        <a href="{{ url_for('tareas') }}" class="btn btn-light rounded-pill px-4">Cancelar</a>
                        <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm">Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
